
services:
  qdrant:
    image: qdrant/qdrant:v1.12.0
    container_name: qdrant
    volumes:
      - /opt/mentoring/qdrant_data:/qdrant/storage
    networks:
      - mentoring-net
    restart: unless-stopped

  app:
    image: ghcr.io/ortosv/task-api:${IMAGE_TAG:-latest}
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      QDRANT_URL: http://qdrant:6333
    networks:
      - mentoring-net
    depends_on:
      - qdrant
    restart: unless-stopped

networks:
  mentoring-net:
    name: mentoring-net