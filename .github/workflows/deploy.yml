
name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy tested image to VPS
        uses: appleboy/ssh-action@v1
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          RELEASE_TAG: ${{ github.event.workflow_run.head_sha }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: LLM_API_KEY,GHCR_TOKEN,RELEASE_TAG
          script: |
            set -eu

            APP_DIR=/opt/mentoring/rag-service
            ENV_FILE="$APP_DIR/.env"
            OLD_TAG=""

            mkdir -p /opt/mentoring

            if [ ! -d "$APP_DIR/.git" ]; then
              git clone https://github.com/OrtosV/task-api.git "$APP_DIR"
            fi

            cd "$APP_DIR"

            # Сохраняем тег предыдущей версии, если он есть.
            if [ -f "$ENV_FILE" ]; then
              OLD_TAG=$(sed -n 's/^IMAGE_TAG=//p' "$ENV_FILE" | head -n 1)
            fi

            git fetch origin main
            git checkout --force --detach "$RELEASE_TAG"

            # Восстанавливаем конфигурацию приложения для нового релиза.
            cat > .env <<EOF
            LLM_API_KEY=$LLM_API_KEY
            QDRANT_URL=http://qdrant:6333
            IMAGE_TAG=$RELEASE_TAG
            EOF

            echo "$GHCR_TOKEN" | docker login ghcr.io \
              -u OrtosV --password-stdin

            docker compose pull app
            docker compose up -d qdrant

            rollback() {
              echo "Deployment failed; attempting rollback."

              if [ -n "$OLD_TAG" ]; then
                cat > .env <<EOF
            LLM_API_KEY=$LLM_API_KEY
            QDRANT_URL=http://qdrant:6333
            IMAGE_TAG=$OLD_TAG
            EOF

                docker compose pull app || true
                docker compose up -d --no-deps app || true

                for i in $(seq 1 12); do
                  if curl --fail --silent \
                    http://127.0.0.1:8000/health; then
                    echo "Previous version restored."
                    return 0
                  fi
                  sleep 5
                done

                echo "Rollback attempted, but health check failed."
              else
                echo "No previous image tag found; automatic rollback unavailable."
              fi

              return 1
            }

            # Останавливаем старое приложение перед переиндексацией.
            docker compose stop app || true

            # Формируем корпус и создаём новый индекс.
            if ! docker compose run --rm --no-deps app sh -c \
              "python -m app.scripts.load_corpus && \
               python -m app.scripts.index_corpus"; then
              rollback || true
              exit 1
            fi

            # Запускаем новую версию.
            if ! docker compose up -d --no-deps app; then
              rollback || true
              exit 1
            fi

            healthy=0
            for i in $(seq 1 30); do
              if curl --fail --silent \
                http://127.0.0.1:8000/health; then
                healthy=1
                break
              fi
              sleep 5
            done

            if [ "$healthy" -ne 1 ]; then
              docker compose logs --tail=100 app
              rollback || true
              exit 1
            fi

            docker image prune -f
            docker logout ghcr.io