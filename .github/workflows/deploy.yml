
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant:v1.12.0
        ports:
          - 6333:6333

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          QDRANT_URL: http://localhost:6333

  build:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/ortosv/task-api:latest
            ghcr.io/ortosv/task-api:${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          RELEASE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: LLM_API_KEY,GHCR_TOKEN,RELEASE_TAG
          script: |
            set -eu

            mkdir -p /opt/mentoring

            if [ ! -d /opt/mentoring/rag-service/.git ]; then
              rm -rf /opt/mentoring/rag-service
              git clone https://github.com/OrtosV/task-api.git \
                /opt/mentoring/rag-service
            fi

            cd /opt/mentoring/rag-service
            git fetch origin main
            git reset --hard origin/main

            cat > .env <<EOF
            LLM_API_KEY=$LLM_API_KEY
            QDRANT_URL=http://qdrant:6333
            IMAGE_TAG=$RELEASE_TAG
            EOF

            echo "$GHCR_TOKEN" | docker login ghcr.io \
              -u OrtosV --password-stdin

            docker compose pull app
            docker compose up -d qdrant

            # Проверяем, что новый образ импортирует приложение.
            docker compose run --rm --no-deps app \
              python -c "from app.main import app; print('Import OK')"

            # Индексируем корпус в новой коллекции.
            # Оба скрипта выполняются в одном контейнере.
            docker compose stop app || true
            docker compose run --rm --no-deps app sh -c \
              "python -m app.scripts.load_corpus && \
               python -m app.scripts.index_corpus"

            # Переключаем приложение на новый образ.
            docker compose up -d --no-deps app

            # Ждём готовности API и проверяем health endpoint.
            healthy=0
            for i in $(seq 1 30); do
              if curl --fail --silent \
                http://127.0.0.1:8000/health; then
                healthy=1
                break
              fi
              sleep 5
            done

            if [ "$healthy" -ne 1 ]; then
              docker compose logs --tail=100 app
              exit 1
            fi

            # Удаляем неиспользуемые образы, не затрагивая тома Qdrant.
            docker image prune -f
            docker logout ghcr.io